<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mietwagen Verwaltung</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 20px; background-color: #f0f2f5; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a1a1a; }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #007aff; color: white; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-size: 17px; font-weight: 600; }
        #searchBar { background-color: #fff9e6; border: 2px solid #ffcc00; margin-bottom: 20px; }
        .car-item { background: #fff; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 5px solid #007aff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="container">
    <h2>Mietwagen Verwaltung</h2>
    <input type="text" id="searchBar" placeholder="🔍 Nach Kennzeichen suchen..." onkeyup="searchCar()">
    
    <div id="formSection">
        <input type="text" id="k" placeholder="Kennzeichen (رقم السيارة)*">
        <input type="text" id="name" placeholder="Name des Mieters (اسم المستأجر)*">
        <input type="tel" id="phone" placeholder="Telefon (الهاتف)">
        <input type="date" id="start" title="Mietbeginn">
        <input type="date" id="end" title="Mietende (اختياري)">
        <input type="text" id="address" placeholder="Adresse (العنوان)">
        <button id="addBtn" onclick="addData()">Speichern (حفظ)</button>
    </div>

    <div id="carList">
        <h3 style="margin-top:30px;">Aktuelle Vermietungen:</h3>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // إعداداتك الخاصة التي جلبتِها الآن
    const firebaseConfig = {
      apiKey: "AIzaSyAOXPQTXx4x67IiDpsHsheC89ySLqkTJZ4",
      authDomain: "rl-app-d89ad.firebaseapp.com",
      projectId: "rl-app-d89ad",
      storageBucket: "rl-app-d89ad.firebasestorage.app",
      messagingSenderId: "410833349675",
      appId: "1:410833349675:web:6fd731f38d625a5eb3ce6e",
      measurementId: "G-PNTF1RR4J2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.addData = async function() {
        const kValue = document.getElementById("k").value.trim().toUpperCase();
        const nameValue = document.getElementById("name").value.trim();
        
        if(!kValue || !nameValue) { 
            alert("⚠️ Bitte Kennzeichen und Name ausfüllen!"); 
            return; 
        }

        const btn = document.getElementById("addBtn");
        try {
            btn.disabled = true; 
            btn.innerText = "Prüfen...";

            // منع التكرار
            const q = query(collection(db, "cars"), where("k", "==", kValue));
            const snap = await getDocs(q);
            if (!snap.empty) { 
                alert("❌ Dieses Kennzeichen existiert bereits!"); 
                btn.disabled = false; 
                btn.innerText = "Speichern"; 
                return; 
            }

            await addDoc(collection(db, "cars"), {
                k: kValue, 
                name: nameValue,
                phone: document.getElementById("phone").value || "-",
                start: document.getElementById("start").value || "-",
                end: document.getElementById("end").value || "Offen",
                address: document.getElementById("address").value || "-",
                createdAt: Date.now()
            });

            alert("✅ Erfolgreich gespeichert!");
            location.reload(); 
        } catch (e) { 
            alert("Fehler: " + e.message); 
            btn.disabled = false; 
            btn.innerText = "Speichern"; 
        }
    };

    async function loadData() {
        const list = document.getElementById("carList");
        try {
            const q = query(collection(db, "cars"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            snap.forEach((doc) => {
                const data = doc.data();
                const div = document.createElement("div");
                div.className = "car-item"; 
                div.setAttribute("data-k", data.k);
                div.innerHTML = `<strong>${data.k}</strong> | ${data.name}<br>
                                 <small>📞 ${data.phone} | 🗓️ ${data.start} bis ${data.end}</small>`;
                list.appendChild(div);
            });
        } catch (e) {
            console.log("Error loading data: ", e);
        }
    }

    window.searchCar = function() {
        const val = document.getElementById("searchBar").value.toUpperCase();
        const items = document.getElementsByClassName("car-item");
        for (let i of items) { 
            i.style.display = i.getAttribute("data-k").includes(val) ? "block" : "none"; 
        }
    };

    loadData();
</script>
</body>
</html>
