<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mietwagen Verwaltung Pro</title>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 20px; background-color: #f0f2f5; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a1a1a; }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background-color: #007aff; color: white; border: none; border-radius: 10px; margin-top: 20px; cursor: pointer; font-size: 17px; font-weight: 600; }
        #searchBar { background-color: #fff9e6; border: 2px solid #ffcc00; margin-bottom: 20px; }
        .car-item { background: #fff; padding: 15px; border-radius: 10px; margin-top: 10px; border-left: 5px solid #007aff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .update-date { margin-top: 10px; padding: 5px; border-radius: 5px; border: 1px solid #ccc; width: auto; display: inline-block; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mietwagen Verwaltung</h2>
    <input type="text" id="searchBar" placeholder="🔍 Nach Kennzeichen suchen..." onkeyup="searchCar()">
    
    <div id="formSection">
        <input type="text" id="k" placeholder="Kennzeichen (رقم السيارة)*">
        <input type="text" id="name" placeholder="Name des Mieters*">
        <input type="tel" id="phone" placeholder="Telefon">
        <input type="date" id="start">
        <input type="date" id="end" title="Mietende (اختياري)">
        <input type="text" id="address" placeholder="Adresse">
        <button id="addBtn" onclick="addData()">Speichern (حفظ)</button>
    </div>

    <div id="carList">
        <h3 style="margin-top:30px;">Aktuelle Vermietungen:</h3>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAOXPQTXx4x67IiDpsHsheC89ySLqkTJZ4",
      authDomain: "rl-app-d89ad.firebaseapp.com",
      projectId: "rl-app-d89ad",
      storageBucket: "rl-app-d89ad.firebasestorage.app",
      messagingSenderId: "410833349675",
      appId: "1:410833349675:web:6fd731f38d625a5eb3ce6e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // إضافة سيارة جديدة
    window.addData = async function() {
        const kValue = document.getElementById("k").value.trim().toUpperCase();
        const nameValue = document.getElementById("name").value.trim();
        if(!kValue || !nameValue) { alert("⚠️ Bitte Kennzeichen und Name ausfüllen!"); return; }

        const btn = document.getElementById("addBtn");
        try {
            btn.disabled = true;
            const q = query(collection(db, "cars"), where("k", "==", kValue));
            const snap = await getDocs(q);
            if (!snap.empty) { alert("❌ Dieses Kennzeichen existiert bereits!"); btn.disabled = false; return; }

            await addDoc(collection(db, "cars"), {
                k: kValue, name: nameValue,
                phone: document.getElementById("phone").value || "-",
                start: document.getElementById("start").value || "-",
                end: document.getElementById("end").value || "Offen",
                address: document.getElementById("address").value || "-",
                createdAt: Date.now()
            });
            location.reload();
        } catch (e) { alert("Fehler: " + e.message); btn.disabled = false; }
    };

    // تحديث التاريخ عند التغيير في الجدول
    window.updateEndDate = async function(docId, newDate) {
        try {
            const carRef = doc(db, "cars", docId);
            await updateDoc(carRef, { end: newDate });
            alert("✅ Datum aktualisiert!");
        } catch (e) { alert("Fehler beim Aktualisieren!"); }
    };

    // تحميل البيانات وعرضها
    async function loadData() {
        const list = document.getElementById("carList");
        const q = query(collection(db, "cars"), orderBy("createdAt", "desc"));
        const snap = await getDocs(q);
        snap.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;
            const div = document.createElement("div");
            div.className = "car-item"; div.setAttribute("data-k", data.k);
            
            // إذا كانت القيمة Offen، سنظهر مربع اختيار تاريخ بدلاً منها
            let endDisplay = data.end;
            if(data.end === "Offen") {
                endDisplay = `<input type="date" class="update-date" onchange="updateEndDate('${id}', this.value)">`;
            }

            div.innerHTML = `<strong>${data.k}</strong> | ${data.name}<br>
                             <small>📞 ${data.phone} | 🗓️ ${data.start} bis ${endDisplay}</small>`;
            list.appendChild(div);
        });
    }

    window.searchCar = function() {
        const val = document.getElementById("searchBar").value.toUpperCase();
        const items = document.getElementsByClassName("car-item");
        for (let i of items) { i.style.display = i.getAttribute("data-k").includes(val) ? "block" : "none"; }
    };

    loadData();
</script>
</body>
</html>
